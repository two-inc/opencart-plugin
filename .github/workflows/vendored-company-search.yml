name: Vendored company search

# The shared company search modules in catalog/view/javascript/two/ are copies
# of the Magento plugin's, byte for byte (TWO-26721). This fails when any copy
# differs from the Magento plugin's staging branch, so a change lands in the
# shared source and is re-vendored here, never patched in this repo. The
# nightly run catches a change there with none here. No secrets: the source
# repo is public.
on:
  pull_request:
  push:
    branches: [staging, main]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendored:
    name: Vendored company search drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: dev/ci/vendored-company-search.sh
