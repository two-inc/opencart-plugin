name: E2E

# Playwright against the docker shop (tests/e2e/compose.yml), on the OpenCart
# floor and the latest 4.1 release. Every PR runs the stub legs: the Two API
# stub answers as api.sandbox.two.inc inside the compose network, so the
# extension runs unchanged and CI needs no secrets. Staging pushes and the
# nightly run add one checkout against Two's real sandbox, which needs the
# TWO_SANDBOX_API_KEY secret and is skipped, saying so, without it. Every PR
# also runs the upgrade smoke (tests/e2e/bin/upgrade-smoke.sh).

on:
  pull_request:
  push:
    branches: [staging, main]
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The one source for the stub's published port: the stub refuses to start
  # without it, and the order's payment_url is built from it.
  TWO_API_STUB_PORT: "8099"
  E2E_PORT: "1240"

jobs:
  e2e:
    name: E2E (OpenCart ${{ matrix.opencart }}, PHP ${{ matrix.php }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor, on the PHP floor. 4.1.0.0 voids an unplaced order on
          # every checkout edit, so this leg places whole orders there too.
          - opencart: "4.1.0.0"
            sha256: 5d9883de4e37852dbb71c83b8833b9aa4419bc3e71d808e62e38522b2fd1b294
            php: "8.1"
          - opencart: "4.1.0.4"
            sha256: cdef537f5a0a7e1b4ddbe16f589dd2e80b10150a09bfbe93ce76ef2d5c3218c0
            php: "8.4"
    env:
      E2E_OPENCART: ${{ matrix.opencart }}
      E2E_OPENCART_SHA256: ${{ matrix.sha256 }}
      E2E_PHP: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Start the shop and the Two API stub
        run: make e2e-up

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the suite
        working-directory: tests/e2e
        run: npx playwright test

      - name: Shop logs
        if: failure()
        run: |
          docker compose -f tests/e2e/compose.yml logs --no-color | tail -200
          docker compose -f tests/e2e/compose.yml exec -T opencart cat /var/www/html/system/storage/logs/error.log || true

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-opencart-${{ matrix.opencart }}
          path: |
            tests/e2e/test-results/
            tests/e2e/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: make e2e-down

  sandbox:
    name: E2E against Two's sandbox (OpenCart 4.1.0.4)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_SANDBOX_API_KEY: ${{ secrets.TWO_SANDBOX_API_KEY }}
    steps:
      - name: Check for the sandbox key
        id: key
        run: |
          if [ -z "$E2E_SANDBOX_API_KEY" ]; then
            echo "::notice::Sandbox leg skipped: the TWO_SANDBOX_API_KEY secret is not available to this run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Start the shop on Two's sandbox
        if: steps.key.outputs.present == 'true'
        run: make e2e-up

      - name: Run the sandbox checkout
        if: steps.key.outputs.present == 'true'
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Shop logs
        if: failure() && steps.key.outputs.present == 'true'
        run: docker compose -f tests/e2e/compose.yml exec -T opencart cat /var/www/html/system/storage/logs/error.log || true

      - name: Tear down
        if: always() && steps.key.outputs.present == 'true'
        run: make e2e-down

  upgrade:
    name: Upgrade smoke (last release to HEAD)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Upgrade from the last release
        run: tests/e2e/bin/upgrade-smoke.sh

      - name: Tear down
        if: always()
        run: make e2e-down
